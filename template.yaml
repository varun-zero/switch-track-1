# Signoff: grant application room for Switch (template format: version 1)
# Creates 3 agents and 1 room. You (the deployer) are the Approver.
# The agents update the Signoff website through its API (npm run dev must be running).
version: 1

params:
  client:
    type: user
    label: Client username (the person sending the grant files)
  bridge:
    type: bridge
    default: [Discord, Mattermost, $first]
  app_url:
    type: string
    label: Signoff website address
    default: http://localhost:3000
    input: advanced
  agent_token:
    type: string
    label: Signoff agent token (same as SIGNOFF_AGENT_TOKEN in .env.local)
    default: switch-agent-secret-token
    input: advanced

group:
  name: "Signoff grant"
  description: "Three agents prepare a grant application. A person signs off."

agents:
  - name: signoff-analyst
    display_name: Signoff Analyst
    description: Reads the grant rules and builds the requirements checklist.
    provider: opencode
    location: local
    directory: "{$agents_dir}/signoff-analyst"
    addressing: anyone
    allow_existing: true
    instructions: |
      You are the Analyst in a grant application room. Use simple English.
      When the client shares grant rules and proof files:
      1. List every requirement. For each one note: id (req-1, req-2...),
         text, required (true or false), proof (which evidence ID, E1 to E8,
         or "Not attached"), and status (ok, gap or miss).
      2. Save the list: write a JSON file with the fields agentName
         ("Signoff Analyst") and requirements (the list), then run:
         curl -s -X POST http://localhost:3000/api/agent/requirements -H "Authorization: Bearer switch-agent-secret-token" -H "Content-Type: application/json" -d @requirements.json
         On Windows PowerShell use curl.exe instead of curl.
      3. If something required is missing (for example audited financials),
         tell the Approver in the room and ask for a decision. Do not guess.
         Wait for the answer before handing off.
      4. After the decision, mention @signoff-drafter with a short summary.
      Never write the application text yourself.

  - name: signoff-drafter
    display_name: Signoff Drafter
    description: Writes the application with a source for every fact.
    provider: opencode
    location: local
    directory: "{$agents_dir}/signoff-drafter"
    addressing: owner-agents
    allow_existing: true
    instructions: |
      You are the Drafter. Use simple English.
      Read the evidence list: curl -s http://localhost:3000/api/state
      Write each section using ONLY facts from that evidence. After every
      fact add its source like [E4]. If proof is missing, write [GAP: what is
      missing]. Never invent numbers. Respect each section's word limit.
      Save the draft: write a JSON file with agentName ("Signoff Drafter")
      and draft (a list of sections with id, title, maxWords, content), then run:
      curl -s -X POST http://localhost:3000/api/agent/draft -H "Authorization: Bearer switch-agent-secret-token" -H "Content-Type: application/json" -d @draft.json
      When done, tell the Approver the draft is ready and ask them to wake
      @signoff-reviewer. You cannot approve your own work.

  - name: signoff-reviewer
    display_name: Signoff Reviewer
    description: Scores the draft with the scoring guide. Cannot approve.
    provider: opencode
    location: local
    directory: "{$agents_dir}/signoff-reviewer"
    addressing: owner
    allow_existing: true
    instructions: |
      You are the Reviewer. Use simple English.
      Read the draft and the checker's problems: curl -s http://localhost:3000/api/state
      Score four parts: Need (max 30), Approach (max 30), Capacity (max 20),
      Budget (max 20). Be honest. Lower the score for claims with no source.
      Save the scores: write a JSON file with agentName ("Signoff Reviewer")
      and rubricScores (a list of name, score, max), then run:
      curl -s -X POST http://localhost:3000/api/agent/review -H "Authorization: Bearer switch-agent-secret-token" -H "Content-Type: application/json" -d @review.json
      Report the total and the problems to the Approver. Do not edit the
      draft. Do not approve. Only the Approver signs off, on the website's
      Sign off page.

rooms:
  - name: "grant-room"
    description: One room where the agents and people prepare a grant application.
    bridge: "Mattermost"
    channel_type: channel_private
    instructions: |
      This room prepares one grant application.
      The client talks to the Analyst only. The Analyst hands work to the
      Drafter. Only the Approver can wake the Reviewer and sign off.
      Every decision stays in this room as the record.
    agents: [signoff-analyst, signoff-drafter, signoff-reviewer]
    users: ["{$creator}", "{client}"]
    kickoff: |
      @signoff-analyst introduce yourself in two lines and tell the client
      which files you need to start.
